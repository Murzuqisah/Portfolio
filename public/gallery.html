<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico?v=6">
    <link rel="stylesheet" href="./css/global.css" type="text/css" />
    <link rel="stylesheet" href="./css/mobile-style.css" type="text/css" />
    <link rel="stylesheet" href="./css/style.css" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/b2aa6d0202.js" crossorigin="anonymous"></script>
    <title>Joel Amos Adero | Photo Gallery</title>
    <style>
        .gallery-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-top: 80px;
        }

        .gallery-wrapper {
            width: 100%;
            max-width: 800px;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 3rem;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--text-primary), rgba(255, 255, 255, 0.7));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gallery-carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .gallery-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1));
            backdrop-filter: blur(20px);
        }

        .gallery-image.active {
            opacity: 1;
        }

        .gallery-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 3rem;
        }

        .gallery-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
            backdrop-filter: blur(10px);
        }

        .gallery-btn:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            transform: scale(1.1);
        }

        .gallery-counter {
            color: var(--text-secondary);
            font-size: 1rem;
            min-width: 100px;
            text-align: center;
        }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .gallery-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
        }

        .gallery-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .gallery-dot:hover {
            border-color: var(--accent-green);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition-speed) ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .gallery-title {
                font-size: 1.75rem;
                margin-bottom: 2rem;
            }

            .gallery-controls {
                gap: 1.5rem;
            }

            .gallery-btn {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }

            .gallery-counter {
                font-size: 0.9rem;
                min-width: 80px;
            }

            .gallery-dots {
                gap: 0.5rem;
            }

            .gallery-dot {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-container">
        <div class="nav-content">
            <div class="navbar-left">
                <div class="location-indicator">
                    <span>Kisumu | Kenya </span>
                    <div class="status-dot"></div>
                </div>
            </div>

            <div class="nav-links">
                <a href="./index.html" class="nav-link">Home</a>
                <a href="./index.html#about" class="nav-link">About</a>
                <a href="./index.html#projects" class="nav-link">Projects</a>
                <a href="./index.html#contact" class="nav-link">Contact</a>
                <a href="./cv.html?file=Joel_Adero_CV.pdf">View CV</a>
                <a href="./gallery.html" class="nav-link active">Gallery</a>
                <div class="time-display">
                    <span id="current-time">20:26:43</span>
                </div>
                <button class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <div class="gallery-container">
        <div class="gallery-wrapper">
            <a href="./index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
            
            <h1 class="gallery-title">Photo Gallery</h1>

            <div class="gallery-carousel">
                <img src="./images/IMG_7022.JPG" alt="Gallery Photo 1" class="gallery-image active">
                <img src="./images/Adero_001.jpg" alt="Gallery Photo 2" class="gallery-image">
                <img src="./images/Adero_002.jpg" alt="Gallery Photo 3" class="gallery-image">
                <img src="./images/Adero_003.jpg" alt="Gallery Photo 4" class="gallery-image">
                <img src="./images/Adero_004.jpg" alt="Gallery Photo 5" class="gallery-image">
                <img src="./images/Adero_005.jpg" alt="Gallery Photo 6" class="gallery-image">
                <img src="./images/Adero_006.JPG" alt="Gallery Photo 7" class="gallery-image">
                <img src="./images/Adero_007.JPG" alt="Gallery Photo 8" class="gallery-image">
                <img src="./images/Adero_008.JPG" alt="Gallery Photo 9" class="gallery-image">
                <img src="./images/Adero_009.jpg" alt="Gallery Photo 10" class="gallery-image">
                <img src="./images/Adero_010.JPG" alt="Gallery Photo 11" class="gallery-image">
            </div>

            <div class="gallery-controls">
                <button class="gallery-btn" id="prev-btn" aria-label="Previous">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="gallery-counter">
                    <span id="current-image">1</span> / <span id="total-images">11</span>
                </div>
                <button class="gallery-btn" id="next-btn" aria-label="Next">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <div class="gallery-dots" id="gallery-dots"></div>
        </div>
    </div>

    <script>
        const images = document.querySelectorAll('.gallery-image');
        const totalImages = images.length;
        let currentIndex = 0;

        const counter = document.getElementById('current-image');
        const totalCounter = document.getElementById('total-images');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const dotsContainer = document.getElementById('gallery-dots');

        // Create dots
        images.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('gallery-dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToImage(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.gallery-dot');

        function showImage(index) {
            images.forEach(img => img.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            images[index].classList.add('active');
            dots[index].classList.add('active');
            counter.textContent = index + 1;
        }

        function goToImage(index) {
            currentIndex = (index + totalImages) % totalImages;
            showImage(currentIndex);
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % totalImages;
            showImage(currentIndex);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + totalImages) % totalImages;
            showImage(currentIndex);
        }

        prevBtn.addEventListener('click', prevImage);
        nextBtn.addEventListener('click', nextImage);
        totalCounter.textContent = totalImages;

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        });
    </script>

    <script type="module" src="./JS/index-time.js"></script>
    <script type="module" src="./JS/theme-toggle.js"></script>
    <script src="./JS/live-reload.js"></script>
</body>
</html>
